<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>归档 - 小白的博客</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .timeline { position: relative; padding-left: 28px; margin: 30px 0 50px; }
    .timeline::before {
      content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px;
      width: 2px; background: var(--border);
    }
    .tl-group { margin-bottom: 30px; }
    .tl-month {
      position: relative; font-size: 18px; font-weight: 700; margin-bottom: 12px; color: var(--primary);
    }
    .tl-month::before {
      content: ""; position: absolute; left: -26px; top: 6px;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--primary); border: 3px solid var(--bg);
    }
    .tl-item {
      display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 16px; margin-bottom: 10px; box-shadow: var(--shadow);
    }
    .tl-item:hover { border-color: var(--primary); }
    .tl-item .date { color: var(--text-light); font-size: 13px; white-space: nowrap; }
  </style>
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="container">
    <div class="page-title">
      <h1>文章归档</h1>
      <p>按时间倒序排列，共 <span id="total">0</span> 篇文章</p>
    </div>

    <div class="timeline" id="timeline"></div>
  </main>

  <footer class="footer" id="footer"></footer>
  <button id="backTop" title="返回顶部">↑</button>

  <script src="js/blog.js"></script>
  <script>
    initPage("archives");

    const sorted = [...POSTS].sort((a, b) => b.date.localeCompare(a.date));
    document.getElementById("total").textContent = sorted.length;

    // 按 "年-月" 分组
    const groups = {};
    sorted.forEach(p => {
      const key = p.date.slice(0, 7); // YYYY-MM
      (groups[key] = groups[key] || []).push(p);
    });

    document.getElementById("timeline").innerHTML = Object.keys(groups).map(key => {
      const [y, m] = key.split("-");
      return `
      <div class="tl-group">
        <div class="tl-month">${y} 年 ${Number(m)} 月（${groups[key].length}）</div>
        ${groups[key].map(p => `
          <a class="tl-item" href="post.html?id=${p.id}">
            <span>${p.emoji} ${p.title}</span>
            <span class="date">${p.date}</span>
          </a>`).join("")}
      </div>`;
    }).join("");
  </script>
</body>
</html>
