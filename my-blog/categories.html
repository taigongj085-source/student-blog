<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类 - 小白的博客</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="container">
    <div class="page-title">
      <h1>文章分类</h1>
      <p>点击分类卡片查看该分类下的全部文章</p>
    </div>

    <section class="section">
      <div class="cat-grid" id="catGrid"></div>
    </section>

    <section class="section" id="catPosts" style="display:none">
      <div class="section-head">
        <h2 id="catPostsTitle"></h2>
        <a href="categories.html">清除筛选 ✕</a>
      </div>
      <div class="post-grid" id="catPostList"></div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>
  <button id="backTop" title="返回顶部">↑</button>

  <script src="js/blog.js"></script>
  <script>
    initPage("categories");

    document.getElementById("catGrid").innerHTML = CATEGORIES.map(c => {
      const count = getPostsByCategory(c.name).length;
      return `
      <div class="cat-card" id="cat-${c.name}">
        <div class="icon">${c.icon}</div>
        <h3><a href="categories.html#${encodeURIComponent(c.name)}">${c.name}</a></h3>
        <p>${c.desc}</p>
        <span class="cat-count">${count} 篇文章</span>
      </div>`;
    }).join("");

    function showCategory() {
      const cat = decodeURIComponent(location.hash.slice(1));
      const sec = document.getElementById("catPosts");
      if (!cat) { sec.style.display = "none"; return; }
      const list = getPostsByCategory(cat).sort((a, b) => b.date.localeCompare(a.date));
      document.getElementById("catPostsTitle").textContent = `「${cat}」下的文章（${list.length}）`;
      document.getElementById("catPostList").innerHTML = list.length
        ? list.map(postCardHTML).join("")
        : `<p class="empty-tip">该分类下暂无文章</p>`;
      sec.style.display = "block";
      sec.scrollIntoView({ behavior: "smooth" });
    }
    window.addEventListener("hashchange", showCategory);
    showCategory();
  </script>
</body>
</html>
