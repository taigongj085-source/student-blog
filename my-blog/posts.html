<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章列表 - 小白的博客</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="container">
    <div class="page-title">
      <h1>全部文章</h1>
      <p>共 <span id="postCount">0</span> 篇文章，可按分类筛选或搜索关键词</p>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 输入标题、摘要或标签关键词…">
    </div>

    <div class="filter-bar" id="filterBar"></div>

    <section class="section">
      <div class="post-grid" id="postList"></div>
      <p class="empty-tip" id="emptyTip" style="display:none">没有找到匹配的文章 😢</p>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>
  <button id="backTop" title="返回顶部">↑</button>

  <script src="js/blog.js"></script>
  <script>
    initPage("posts");

    let currentCat = "全部";
    let keyword = "";

    // 筛选按钮
    const cats = ["全部", ...CATEGORIES.map(c => c.name)];
    document.getElementById("filterBar").innerHTML = cats.map(c =>
      `<button class="filter-btn ${c === "全部" ? "active" : ""}" data-cat="${c}">${c}</button>`
    ).join("");

    document.getElementById("filterBar").addEventListener("click", e => {
      if (!e.target.dataset.cat) return;
      currentCat = e.target.dataset.cat;
      document.querySelectorAll(".filter-btn").forEach(b =>
        b.classList.toggle("active", b.dataset.cat === currentCat));
      render();
    });

    // 搜索
    document.getElementById("searchInput").addEventListener("input", e => {
      keyword = e.target.value.trim().toLowerCase();
      render();
    });

    function render() {
      let list = [...POSTS].sort((a, b) => b.date.localeCompare(a.date));
      if (currentCat !== "全部") list = list.filter(p => p.category === currentCat);
      if (keyword) {
        list = list.filter(p =>
          p.title.toLowerCase().includes(keyword) ||
          p.excerpt.toLowerCase().includes(keyword) ||
          p.tags.some(t => t.toLowerCase().includes(keyword)));
      }
      document.getElementById("postCount").textContent = POSTS.length;
      document.getElementById("postList").innerHTML = list.map(postCardHTML).join("");
      document.getElementById("emptyTip").style.display = list.length ? "none" : "block";
    }
    render();
  </script>
</body>
</html>
