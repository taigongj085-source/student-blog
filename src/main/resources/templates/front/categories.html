<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类 - 小白的博客</title>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <link th:href="@{/css/extra.css}" rel="stylesheet">
  <script th:src="@{/js/common.js}" defer></script>
</head>
<body>
<header th:replace="~{front/fragments/layout :: navbar(${navActive})}"></header>

<main class="container">
  <div class="page-title">
    <h1>文章分类</h1>
    <p>按主题浏览内容</p>
  </div>

  <section class="section">
    <div class="cat-grid">
      <div class="cat-card" th:each="m : ${categoryMeta}">
        <div class="icon" th:text="${m.icon()}">💻</div>
        <h3>
          <a th:href="@{/categories(name=${m.name()})}" th:text="${m.name()}">分类</a>
        </h3>
        <p th:text="${m.desc()}">描述</p>
        <span class="cat-count"
              th:if="${categoryCounts != null and categoryCounts.containsKey(m.name())}"
              th:text="${categoryCounts.get(m.name())} + ' 篇文章'">0 篇文章</span>
        <span class="cat-count" th:unless="${categoryCounts != null and categoryCounts.containsKey(m.name())}">0 篇文章</span>
      </div>
    </div>
  </section>

  <section class="section" th:if="${curCategory != null}">
    <div class="section-head">
      <h2 th:text="'📁 ' + ${curCategory}">分类</h2>
      <a th:href="@{/categories}">返回全部分类</a>
    </div>
    <div class="post-grid" th:if="${posts != null and !posts.isEmpty()}">
      <article class="post-card" th:each="p : ${posts}">
        <a th:href="@{/post/{id}(id=${p.id})}">
          <div class="post-cover" th:style="'background:'+${p.coverColor}" th:text="${p.coverEmoji}">📝</div>
        </a>
        <div class="post-body">
          <div class="post-meta">
            <span th:text="'📅 '+${#temporals.format(p.createTime,'yyyy-MM-dd')}">📅</span>
            <span th:text="'👁 '+${p.viewCount}">👁 0</span>
          </div>
          <h3><a th:href="@{/post/{id}(id=${p.id})}" th:text="${p.title}">标题</a></h3>
          <p class="post-excerpt" th:text="${p.excerpt}">摘要</p>
          <div class="post-tags">
            <a class="tag" th:each="t : ${p.tagList}" th:href="@{/tags(name=${t})}" th:text="'#'+${t}">#tag</a>
          </div>
        </div>
      </article>
    </div>
    <p class="empty-tip" th:if="${posts == null or posts.isEmpty()}">该分类下暂无文章</p>
  </section>
</main>

<footer th:replace="~{front/fragments/layout :: footer}"></footer>
<button id="backTop" title="返回顶部">↑</button>
</body>
</html>
