<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写文章 - 小白的博客</title>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <link th:href="@{/css/extra.css}" rel="stylesheet">
  <script th:src="@{/js/common.js}" defer></script>
</head>
<body>
<header th:replace="~{front/fragments/layout :: navbar(${navActive})}"></header>

<main class="container">
  <div class="page-title">
    <h1>✍️ 写文章</h1>
    <p>分享你的想法与实践</p>
  </div>

  <div class="form-card wide">
    <form th:action="@{/post/create}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-group">
        <label for="title">标题 *</label>
        <input type="text" id="title" name="title" required maxlength="120" placeholder="起一个吸引人的标题">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="category">分类 *</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>选择分类</option>
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">分类</option>
          </select>
        </div>
        <div class="form-group">
          <label for="tags">标签</label>
          <input type="text" id="tags" name="tags" placeholder="多个标签用逗号分隔，如 HTML,CSS">
        </div>
      </div>

      <div class="form-group">
        <label for="excerpt">摘要</label>
        <textarea id="excerpt" name="excerpt" rows="2" maxlength="300" placeholder="一句话介绍文章（可选，不填将自动截取正文）"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="coverEmoji">封面 Emoji</label>
          <input type="text" id="coverEmoji" name="coverEmoji" placeholder="如 🚀（可选）">
        </div>
        <div class="form-group">
          <label for="coverColor">封面背景</label>
          <input type="text" id="coverColor" name="coverColor" placeholder="如 linear-gradient(...)（可选）">
        </div>
      </div>

      <div class="form-group">
        <label for="content">正文 *（支持 HTML）</label>
        <textarea id="content" name="content" rows="16" required placeholder="写下正文，可使用 &lt;p&gt; &lt;h2&gt; &lt;pre&gt; 等标签"></textarea>
      </div>

      <button type="submit" class="btn">发布文章</button>
      <a class="btn" style="background:var(--bg);color:var(--text);margin-left:8px;border:1px solid var(--border)"
         th:href="@{/posts}">取消</a>
    </form>
  </div>
</main>

<footer th:replace="~{front/fragments/layout :: footer}"></footer>
<button id="backTop" title="返回顶部">↑</button>
</body>
</html>
