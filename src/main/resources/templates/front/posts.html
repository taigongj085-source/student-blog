<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部文章 - 小白的博客</title>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <link th:href="@{/css/extra.css}" rel="stylesheet">
  <script th:src="@{/js/common.js}" defer></script>
</head>
<body>
<header th:replace="~{front/fragments/layout :: navbar(${navActive})}"></header>

<main class="container">
  <div class="page-title">
    <h1>全部文章</h1>
    <p>搜索、筛选，找到你感兴趣的内容</p>
  </div>

  <form class="search-box" th:action="@{/posts}" method="get">
    <input type="search" name="q" th:value="${keyword}" placeholder="搜索文章标题或内容…">
    <input type="hidden" name="cat" th:value="${curCat}">
    <input type="hidden" name="sort" th:value="${curSort}">
  </form>

  <div class="filter-bar">
    <a class="filter-btn" th:href="@{/posts(q=${keyword},sort=${curSort})}"
       th:classappend="${curCat == null or curCat == '全部'} ? ' active'">全部</a>
    <a class="filter-btn" th:each="c : ${allCategories}"
       th:href="@{/posts(cat=${c},q=${keyword},sort=${curSort})}"
       th:text="${c}"
       th:classappend="${curCat == c} ? ' active'">分类</a>
  </div>

  <section class="section">
    <div class="post-grid" th:if="${posts != null and !posts.isEmpty()}">
      <article class="post-card" th:each="p : ${posts}">
        <a th:href="@{/post/{id}(id=${p.id})}">
          <div class="post-cover" th:style="'background:'+${p.coverColor}" th:text="${p.coverEmoji}">📝</div>
        </a>
        <div class="post-body">
          <div class="post-meta">
            <span th:text="'📅 '+${#temporals.format(p.createTime,'yyyy-MM-dd')}">📅</span>
            <span>📁 <a th:href="@{/categories(name=${p.category})}" th:text="${p.category}"></a></span>
            <span th:text="'👁 '+${p.viewCount}">👁 0</span>
          </div>
          <h3><a th:href="@{/post/{id}(id=${p.id})}" th:text="${p.title}">标题</a></h3>
          <p class="post-excerpt" th:text="${p.excerpt}">摘要</p>
          <div class="post-tags">
            <a class="tag" th:each="t : ${p.tagList}" th:href="@{/tags(name=${t})}" th:text="'#'+${t}">#tag</a>
          </div>
        </div>
      </article>
    </div>
    <p class="empty-tip" th:if="${posts == null or posts.isEmpty()}">没有找到相关文章</p>

    <div class="pager" th:if="${page != null and page.pages > 1}">
      <a th:if="${page.current > 1}"
         th:href="@{/posts(page=${page.current - 1},cat=${curCat},q=${keyword},sort=${curSort})}">上一页</a>
      <span th:text="'第 ' + ${page.current} + ' / ' + ${page.pages} + ' 页'"></span>
      <a th:if="${page.current < page.pages}"
         th:href="@{/posts(page=${page.current + 1},cat=${curCat},q=${keyword},sort=${curSort})}">下一页</a>
    </div>
  </section>
</main>

<footer th:replace="~{front/fragments/layout :: footer}"></footer>
<button id="backTop" title="返回顶部">↑</button>
</body>
</html>
