<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${notFound} ? '未找到文章 - 小白的博客' : (post != null ? post.title + ' - 小白的博客' : '文章详情 - 小白的博客')">文章详情 - 小白的博客</title>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <link th:href="@{/css/extra.css}" rel="stylesheet">
  <script th:src="@{/js/common.js}" defer></script>
</head>
<body>
<header th:replace="~{front/fragments/layout :: navbar(${navActive})}"></header>

<main class="container" th:if="${notFound}">
  <div class="page-title">
    <h1>文章不存在</h1>
    <p>可能已被删除，或链接有误</p>
  </div>
  <p class="empty-tip"><a th:href="@{/posts}">← 返回文章列表</a></p>
</main>

<main class="container" th:if="${notFound == null or !notFound}">
  <article class="article" th:if="${post != null}">
    <div class="article-cover" th:style="'background:'+${post.coverColor}" th:text="${post.coverEmoji}">📝</div>
    <h1 th:text="${post.title}">标题</h1>
    <div class="post-meta">
      <span th:text="'📅 '+${#temporals.format(post.createTime,'yyyy-MM-dd HH:mm')}">📅</span>
      <span>📁 <a th:href="@{/categories(name=${post.category})}" th:text="${post.category}"></a></span>
      <span th:if="${post.author != null}">
        👤 <span th:text="${post.author.username}">作者</span>
      </span>
      <span th:text="'👁 '+${post.viewCount}">👁 0</span>
      <span th:text="'💬 '+${post.commentCount}">💬 0</span>
    </div>
    <div class="post-tags" style="margin-bottom:20px">
      <a class="tag" th:each="t : ${post.tagList}" th:href="@{/tags(name=${t})}" th:text="'#'+${t}">#tag</a>
    </div>

    <div class="article-content" th:utext="${post.content}">内容</div>

    <div class="action-bar" th:if="${loginUser != null}">
      <button type="button" class="like-btn" id="likeBtn"
              th:classappend="${post.liked} ? ' active'"
              th:attr="data-id=${post.id}"
              th:text="${post.liked} ? '❤️ 已赞 ' + post.likeCount : '🤍 点赞 ' + post.likeCount">
        🤍 点赞
      </button>
      <button type="button" class="fav-btn" id="favBtn"
              th:classappend="${post.favorited} ? ' active'"
              th:attr="data-id=${post.id}"
              th:text="${post.favorited} ? '⭐ 已收藏 ' + post.favoriteCount : '☆ 收藏 ' + post.favoriteCount">
        ☆ 收藏
      </button>
      <form th:if="${canDelete}" th:action="@{/post/delete/{id}(id=${post.id})}" method="post" style="display:inline"
            onsubmit="return confirm('确定删除这篇文章吗？');">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="like-btn" style="color:#e74c3c">🗑 删除</button>
      </form>
    </div>
    <div class="action-bar" th:if="${loginUser == null}">
      <a class="like-btn" th:href="@{/login(redirect=${'/post/' + post.id})}">登录后点赞 / 收藏</a>
    </div>
  </article>

  <section class="comments" id="comments" th:if="${post != null}">
    <h2 th:text="'💬 评论 (' + ${#lists.size(comments)} + ')'">评论</h2>

    <div th:if="${loginUser != null}" class="comment-form" style="margin-bottom:20px">
      <form th:action="@{/comment/add}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="postId" th:value="${post.id}"/>
        <textarea name="content" required maxlength="1000" placeholder="写下你的想法…"></textarea>
        <button type="submit" class="btn">发表评论</button>
      </form>
    </div>
    <p th:if="${loginUser == null}" style="margin-bottom:16px;color:var(--text-light)">
      <a th:href="@{/login(redirect=${'/post/' + post.id + '#comments'})}">登录</a> 后即可发表评论
    </p>

    <div th:if="${comments != null and !comments.isEmpty()}">
      <div class="comment-item" th:each="c : ${comments}">
        <div class="c-head">
          <span class="user-avatar"
                th:style="${c.author != null} ? 'background:' + c.author.color + ';width:28px;height:28px;font-size:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff' : 'width:28px;height:28px'"
                th:text="${c.author != null ? c.author.avatar : '👤'}">😀</span>
          <span class="who" th:text="${c.author != null ? c.author.username : '匿名'}">用户</span>
          <span class="floor" th:text="'#' + c.floorNo">#1</span>
          <span class="when" th:text="${#temporals.format(c.createTime,'yyyy-MM-dd HH:mm')}">时间</span>
        </div>
        <div class="c-body" th:text="${c.content}">内容</div>
        <div class="c-actions" th:if="${loginUser != null}">
          <button type="button" class="like-btn sm comment-like"
                  th:classappend="${c.liked} ? ' active'"
                  th:attr="data-id=${c.id}"
                  th:text="${c.liked} ? '❤️ ' + c.likeCount : '🤍 ' + c.likeCount">🤍 0</button>
        </div>
      </div>
    </div>
    <p class="empty-tip" th:if="${comments == null or comments.isEmpty()}">还没有评论，来抢沙发吧～</p>
  </section>
</main>

<footer th:replace="~{front/fragments/layout :: footer}"></footer>
<button id="backTop" title="返回顶部">↑</button>

<script th:inline="javascript" th:if="${post != null}">
  document.addEventListener('DOMContentLoaded', function () {
    var likeBtn = document.getElementById('likeBtn');
    var favBtn = document.getElementById('favBtn');
    if (likeBtn) {
      likeBtn.addEventListener('click', async function () {
        var id = likeBtn.getAttribute('data-id');
        var data = await postAction('/api/like/post/' + id);
        if (!data || data.code !== 0) return;
        var d = data.data;
        likeBtn.classList.toggle('active', d.liked);
        likeBtn.textContent = (d.liked ? '❤️ 已赞 ' : '🤍 点赞 ') + d.count;
      });
    }
    if (favBtn) {
      favBtn.addEventListener('click', async function () {
        var id = favBtn.getAttribute('data-id');
        var data = await postAction('/api/favorite/' + id);
        if (!data || data.code !== 0) return;
        var d = data.data;
        favBtn.classList.toggle('active', d.favorited);
        favBtn.textContent = (d.favorited ? '⭐ 已收藏 ' : '☆ 收藏 ') + d.count;
      });
    }
    document.querySelectorAll('.comment-like').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var id = btn.getAttribute('data-id');
        var data = await postAction('/api/like/comment/' + id);
        if (!data || data.code !== 0) return;
        var d = data.data;
        btn.classList.toggle('active', d.liked);
        btn.textContent = (d.liked ? '❤️ ' : '🤍 ') + d.count;
      });
    });
  });
</script>
</body>
</html>
