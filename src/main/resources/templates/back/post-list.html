<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章管理 - 小白的博客</title>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <link th:href="@{/css/extra.css}" rel="stylesheet">
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-side">
    <div class="brand">小白博客 · 后台</div>
    <a th:href="@{/admin}" th:classappend="${menu == 'dashboard'} ? ' active'">📊 仪表盘</a>
    <a th:href="@{/admin/posts}" th:classappend="${menu == 'posts'} ? ' active'">📝 文章管理</a>
    <a th:href="@{/admin/comments}" th:classappend="${menu == 'comments'} ? ' active'">💬 评论管理</a>
    <a th:href="@{/admin/users}" th:classappend="${menu == 'users'} ? ' active'">👥 用户管理</a>
    <a th:href="@{/}" target="_blank">🏠 前台首页</a>
    <a th:href="@{/admin/logout}">🚪 退出</a>
  </aside>

  <main class="admin-main">
    <div class="admin-top">
      <h1>文章管理</h1>
    </div>

    <div class="admin-card">
      <form class="admin-search" th:action="@{/admin/posts}" method="get">
        <input type="search" name="q" th:value="${q}" placeholder="搜索标题…">
        <button type="submit" class="admin-btn primary">搜索</button>
      </form>

      <table class="admin-table">
        <thead>
        <tr>
          <th>ID</th>
          <th>标题</th>
          <th>分类</th>
          <th>浏览</th>
          <th>状态</th>
          <th>置顶</th>
          <th>时间</th>
          <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${page.records}">
          <td th:text="${p.id}">1</td>
          <td>
            <a th:href="@{/post/{id}(id=${p.id})}" target="_blank" th:text="${p.title}">标题</a>
          </td>
          <td th:text="${p.category}">分类</td>
          <td th:text="${p.viewCount}">0</td>
          <td>
            <span class="badge ok" th:if="${p.status == 1}">已发布</span>
            <span class="badge off" th:if="${p.status != 1}">下架</span>
          </td>
          <td>
            <span class="badge warn" th:if="${p.isTop != null and p.isTop == 1}">置顶</span>
            <span class="badge" th:unless="${p.isTop != null and p.isTop == 1}">否</span>
          </td>
          <td th:text="${#temporals.format(p.createTime,'yyyy-MM-dd')}">日期</td>
          <td>
            <form class="admin-inline-form" th:action="@{/admin/posts/{id}/top(id=${p.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="isTop" th:value="${p.isTop != null and p.isTop == 1} ? 0 : 1"/>
              <button type="submit" class="admin-btn ghost"
                      th:text="${p.isTop != null and p.isTop == 1} ? '取消置顶' : '置顶'">置顶</button>
            </form>
            <form class="admin-inline-form" th:action="@{/admin/posts/{id}/status(id=${p.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="status" th:value="${p.status == 1} ? 0 : 1"/>
              <button type="submit" class="admin-btn ghost"
                      th:text="${p.status == 1} ? '下架' : '上架'">下架</button>
            </form>
            <form class="admin-inline-form" th:action="@{/admin/posts/{id}/delete(id=${p.id})}" method="post"
                  onsubmit="return confirm('确定删除该文章？');">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="admin-btn danger">删除</button>
            </form>
          </td>
        </tr>
        <tr th:if="${page == null or page.records == null or page.records.isEmpty()}">
          <td colspan="8" style="text-align:center;color:#94a3b8">暂无数据</td>
        </tr>
        </tbody>
      </table>

      <div class="pager" th:if="${page != null and page.pages > 1}">
        <a th:if="${page.current > 1}" th:href="@{/admin/posts(page=${page.current - 1},q=${q})}">上一页</a>
        <span th:text="'第 ' + ${page.current} + ' / ' + ${page.pages} + ' 页'"></span>
        <a th:if="${page.current < page.pages}" th:href="@{/admin/posts(page=${page.current + 1},q=${q})}">下一页</a>
      </div>
    </div>
  </main>
</div>
</body>
</html>
