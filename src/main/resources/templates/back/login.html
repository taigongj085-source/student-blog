<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台登录 - 小白的博客</title>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <link th:href="@{/css/extra.css}" rel="stylesheet">
</head>
<body class="admin-body">
<div class="admin-login-wrap">
  <div class="admin-login-card">
    <h2>🔐 管理后台</h2>
    <div class="alert-error" th:if="${errorMsg}" th:text="${errorMsg}"></div>
    <form th:action="@{/admin/doLogin}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="form-group">
        <label for="username">管理员昵称</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="管理员账号">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="密码">
      </div>
      <button type="submit" class="btn">登录</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:#64748b">
      <a th:href="@{/}">← 返回前台</a>
    </p>
  </div>
</div>
</body>
</html>
