<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评论管理 - 小白的博客</title>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <link th:href="@{/css/extra.css}" rel="stylesheet">
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-side">
    <div class="brand">小白博客 · 后台</div>
    <a th:href="@{/admin}" th:classappend="${menu == 'dashboard'} ? ' active'">📊 仪表盘</a>
    <a th:href="@{/admin/posts}" th:classappend="${menu == 'posts'} ? ' active'">📝 文章管理</a>
    <a th:href="@{/admin/comments}" th:classappend="${menu == 'comments'} ? ' active'">💬 评论管理</a>
    <a th:href="@{/admin/users}" th:classappend="${menu == 'users'} ? ' active'">👥 用户管理</a>
    <a th:href="@{/}" target="_blank">🏠 前台首页</a>
    <a th:href="@{/admin/logout}">🚪 退出</a>
  </aside>

  <main class="admin-main">
    <div class="admin-top">
      <h1>评论管理</h1>
    </div>

    <div class="admin-card">
      <table class="admin-table">
        <thead>
        <tr>
          <th>ID</th>
          <th>内容</th>
          <th>文章</th>
          <th>用户</th>
          <th>点赞</th>
          <th>时间</th>
          <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${page.records}">
          <td th:text="${c.id}">1</td>
          <td style="max-width:280px" th:text="${c.content}">内容</td>
          <td>
            <a th:href="@{/post/{id}(id=${c.postId})}" target="_blank"
               th:text="${c.postTitle != null} ? c.postTitle : '#' + c.postId">文章</a>
          </td>
          <td th:text="${c.author != null} ? c.author.username : c.userId">用户</td>
          <td th:text="${c.likeCount}">0</td>
          <td th:text="${#temporals.format(c.createTime,'yyyy-MM-dd HH:mm')}">时间</td>
          <td>
            <form class="admin-inline-form" th:action="@{/admin/comments/{id}/delete(id=${c.id})}" method="post"
                  onsubmit="return confirm('确定删除该评论？');">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="admin-btn danger">删除</button>
            </form>
          </td>
        </tr>
        <tr th:if="${page == null or page.records == null or page.records.isEmpty()}">
          <td colspan="7" style="text-align:center;color:#94a3b8">暂无数据</td>
        </tr>
        </tbody>
      </table>

      <div class="pager" th:if="${page != null and page.pages > 1}">
        <a th:if="${page.current > 1}" th:href="@{/admin/comments(page=${page.current - 1})}">上一页</a>
        <span th:text="'第 ' + ${page.current} + ' / ' + ${page.pages} + ' 页'"></span>
        <a th:if="${page.current < page.pages}" th:href="@{/admin/comments(page=${page.current + 1})}">下一页</a>
      </div>
    </div>
  </main>
</div>
</body>
</html>
