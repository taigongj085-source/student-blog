<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 小白的博客</title>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <link th:href="@{/css/extra.css}" rel="stylesheet">
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-side">
    <div class="brand">小白博客 · 后台</div>
    <a th:href="@{/admin}" th:classappend="${menu == 'dashboard'} ? ' active'">📊 仪表盘</a>
    <a th:href="@{/admin/posts}" th:classappend="${menu == 'posts'} ? ' active'">📝 文章管理</a>
    <a th:href="@{/admin/comments}" th:classappend="${menu == 'comments'} ? ' active'">💬 评论管理</a>
    <a th:href="@{/admin/users}" th:classappend="${menu == 'users'} ? ' active'">👥 用户管理</a>
    <a th:href="@{/}" target="_blank">🏠 前台首页</a>
    <a th:href="@{/admin/logout}">🚪 退出</a>
  </aside>

  <main class="admin-main">
    <div class="admin-top">
      <h1>用户管理</h1>
    </div>

    <div class="admin-card">
      <table class="admin-table">
        <thead>
        <tr>
          <th>ID</th>
          <th>头像</th>
          <th>昵称</th>
          <th>角色</th>
          <th>状态</th>
          <th>注册时间</th>
          <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${page.records}">
          <td th:text="${u.id}">1</td>
          <td>
            <span class="user-avatar" th:style="'background:' + ${u.color}" th:text="${u.avatar}">😀</span>
          </td>
          <td th:text="${u.username}">用户</td>
          <td>
            <span class="badge warn" th:if="${u.role != null and u.role == 1}">管理员</span>
            <span class="badge" th:unless="${u.role != null and u.role == 1}">普通用户</span>
          </td>
          <td>
            <span class="badge ok" th:if="${u.status == 1}">正常</span>
            <span class="badge off" th:if="${u.status != 1}">禁用</span>
          </td>
          <td th:text="${#temporals.format(u.createTime,'yyyy-MM-dd')}">日期</td>
          <td>
            <form class="admin-inline-form" th:action="@{/admin/users/{id}/status(id=${u.id})}" method="post"
                  th:if="${u.role == null or u.role != 1}">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="status" th:value="${u.status == 1} ? 0 : 1"/>
              <button type="submit" class="admin-btn"
                      th:classappend="${u.status == 1} ? ' danger' : ' primary'"
                      th:text="${u.status == 1} ? '禁用' : '启用'">禁用</button>
            </form>
            <span th:if="${u.role != null and u.role == 1}" style="color:#94a3b8;font-size:12px">不可操作</span>
          </td>
        </tr>
        <tr th:if="${page == null or page.records == null or page.records.isEmpty()}">
          <td colspan="7" style="text-align:center;color:#94a3b8">暂无数据</td>
        </tr>
        </tbody>
      </table>

      <div class="pager" th:if="${page != null and page.pages > 1}">
        <a th:if="${page.current > 1}" th:href="@{/admin/users(page=${page.current - 1})}">上一页</a>
        <span th:text="'第 ' + ${page.current} + ' / ' + ${page.pages} + ' 页'"></span>
        <a th:if="${page.current < page.pages}" th:href="@{/admin/users(page=${page.current + 1})}">下一页</a>
      </div>
    </div>
  </main>
</div>
</body>
</html>
